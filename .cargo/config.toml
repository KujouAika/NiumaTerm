[target.aarch64-apple-darwin]
rustflags = [
    # We can guarantee that this target will always run on a CPU with _at least_
    # these capabilities, so let's optimize for them
    "-Ctarget-cpu=apple-m1"
]
# Sign each binary with the Developer ID identity before it runs, so rebuilds
# keep one identity and the Keychain stops asking again after every build.
runner = "scripts/macos-dev-sign.sh"

[target.'cfg(target_os = "windows")']
rustflags = [
    "--cfg",
    "windows_slim_errors",        # This cfg will reduce the size of `windows::core::Error` from 16 bytes to 4 bytes
    # libghostty-vt.a is built by Zig against the static MSVC CRT (/MT). Match
    # it across the whole Windows build so cc-built deps (simdutf, onig) and
    # Rust std also use /MT, avoiding LNK2038 RuntimeLibrary mismatches.
    "-C",
    "target-feature=+crt-static",
    # Warnings fail the build so they are fixed where they appear.
    "-D",
    "warnings",
]

# Code gated to one platform is only compiled on that platform, so each
# platform fails its own build on warnings rather than leaving them for a
# machine that never sees them. Cargo joins these flags with the target
# triple's own table above.
[target.'cfg(target_os = "macos")']
rustflags = ["-D", "warnings"]

[alias]
readability = "run --quiet --locked --manifest-path tools/readability/Cargo.toml --"

[unstable]
feature-unification = true

[resolver]
feature-unification = "workspace"
