# XcodeGen spec (design doc §5). Optional: `xcodegen` regenerates NiumaTerm.xcodeproj.
# Use it once you add the Notification Service Extension and the NiumaTermCore package.
name: NiumaTerm
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  NiumaTerm:
    type: application
    platform: iOS
    sources: [NiumaTerm]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.niumaterm
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: NiumaTerm
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the pairing QR code shown by NiumaTerm on your computer.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock NiumaTerm when returning to the app.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
