# XcodeGen spec. NiumaTerm.xcodeproj is generated from it: after editing
# this file, run `xcodegen` in mobile/ios and commit both.
name: NiumaTerm
options:
  # Recorded as LastUpgradeCheck; an older value makes Xcode offer to
  # upgrade the project settings.
  xcodeVersion: "27.0"
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The Rust core is built for Apple-silicon simulators only.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    # Where Swift finds the NiumaTermCoreFFI C module that the bindings
    # import; the app needs it too, to load the NiumaTermCore module.
    SWIFT_INCLUDE_PATHS: $(inherited) $(SRCROOT)/NiumaTermCore/Generated
targets:
  NiumaTerm:
    type: application
    platform: iOS
    # A synchronized folder: files added under NiumaTerm/ join the target
    # without editing the project.
    sources:
      - path: NiumaTerm
        type: syncedFolder
    # Team ID and bundle ID come from here and a gitignored Local.xcconfig.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - target: NiumaTermCore
      # Copied here by the NiumaTermCore target's build phase. Listing it in
      # the link phase, rather than in OTHER_LDFLAGS, makes Xcode relink the
      # app whenever the Rust library changes.
      - framework: libnmt_mobile.a
        implicit: true
        embed: false
      - target: NiumaTermNotifications
    settings:
      base:
        # A Rust static library records no link dependencies of its own;
        # these are what `--print native-static-libs` reports for it.
        # Written as a list because Xcode stores list-type settings one
        # token per entry and rewrites a single string when it opens the
        # project.
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Security
          - -framework
          - CoreFoundation
          - -lutil
          - -liconv
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/NiumaTerm.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: NiumaTerm-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: NiumaTerm
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the pairing QR code shown by NiumaTerm on your computer.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock NiumaTerm when returning to the app.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to NiumaTerm on a computer in this network.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Export compliance, answered once here instead of on every upload.
        # The encryption (Noise with standard algorithms) only protects the
        # user's own data between their devices and computers, which the
        # developer treats as exempt. It is a build setting rather than an
        # Info.plist entry because Xcode moves keys it can generate out of
        # the Info.plist file, rewriting that file and dropping its comments.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  # The Rust core (crates/mobile) and its UniFFI Swift bindings, built for
  # the platform and configuration of each build by
  # scripts/build-ios-core.sh. The bindings are build outputs and are not
  # committed.
  NiumaTermCore:
    type: library.static
    platform: iOS
    sources:
      - path: NiumaTermCore/Generated/NiumaTermCore.swift
        optional: true
    preBuildScripts:
      - name: Build Rust core
        script: '"$SRCROOT/../../scripts/build-ios-core.sh"'
        # cargo decides what is out of date, so the phase runs every build.
        basedOnDependencyAnalysis: false
        showEnvVarsInLog: false
        outputFiles:
          - $(SRCROOT)/NiumaTermCore/Generated/NiumaTermCore.swift
          - $(SRCROOT)/NiumaTermCore/Generated/NiumaTermCoreFFI.h
          - $(SRCROOT)/NiumaTermCore/Generated/module.modulemap
          - $(BUILT_PRODUCTS_DIR)/libnmt_mobile.a
    settings:
      base:
        # The script reads the Rust workspace and writes the bindings into
        # the source tree, outside what a sandboxed script may touch.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The generated bindings predate Swift 6 strict concurrency.
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
  # Opens sealed push notifications before they are shown (see
  # NotificationService/NotificationService.swift).
  NiumaTermNotifications:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
        type: syncedFolder
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/NiumaTermNotifications.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: $(NMT_APP_BUNDLE_ID).notifications
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: NotificationService-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: NiumaTerm Notifications
