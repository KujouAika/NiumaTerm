[package]
name = "gpui_apple"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/gpui_apple.rs"

[features]
default = []
bench-support = ["gpui/bench-support"]
test-support = ["gpui/test-support"]
runtime_shaders = []

[dependencies]
gpui.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
anyhow.workspace = true
block2.workspace = true
collections.workspace = true
derive_more.workspace = true
dispatch2.workspace = true
etagere.workspace = true
image.workspace = true
log.workspace = true
objc2.workspace = true
objc2-core-foundation.workspace = true
objc2-core-video.workspace = true
objc2-foundation.workspace = true
objc2-metal.workspace = true
objc2-quartz-core.workspace = true
parking_lot.workspace = true

[target.'cfg(target_os = "macos")'.build-dependencies]
cbindgen.workspace = true
gpui.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
