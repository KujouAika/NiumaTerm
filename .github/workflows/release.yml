name: Release build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, for example v1.1.0
        required: true

jobs:
  package:
    uses: ./.github/workflows/windows-package.yml
    with:
      # A tag push leaves github.ref_name as the tag itself; a manual run has to
      # name one, so the build always resolves to a tagged revision.
      ref: ${{ inputs.tag || github.ref_name }}
      version: ${{ inputs.tag || github.ref_name }}

  package-macos:
    uses: ./.github/workflows/macos-package.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      version: ${{ inputs.tag || github.ref_name }}
    # Signing and notarization need the certificate and App Store Connect
    # secrets, which a called workflow does not inherit on its own.
    secrets: inherit

  release:
    needs: [package, package-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NiumaTerm-windows-x86_64-${{ inputs.tag || github.ref_name }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package-macos.outputs.artifact }}
          path: dist
      # The tag already exists on the remote, so the release just attaches to
      # it; --repo stands in for a checkout this job has no other use for.
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: >-
          gh release create "$TAG" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "$TAG"
          --generate-notes

  # After the release, because the metadata points at assets that have to be
  # downloadable by the time an updater reads it. A release carries no channel
  # name: the default channel is the one every installation sees.
  updates:
    needs: [package-macos, release]
    uses: ./.github/workflows/updates.yml
    with:
      label: ${{ inputs.tag || github.ref_name }}
      bundle-version: ${{ needs.package-macos.outputs.bundle-version }}
      channel: ''
      asset: ${{ needs.package-macos.outputs.asset }}
      length: ${{ needs.package-macos.outputs.length }}
      signature: ${{ needs.package-macos.outputs.ed-signature }}
    # Named one by one rather than inherited, so the signing and notarization
    # credentials this workflow also holds stay out of the called workflow.
    secrets:
      cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
