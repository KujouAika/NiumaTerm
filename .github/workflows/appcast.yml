name: Appcast

on:
  workflow_call:
    inputs:
      label:
        description: Release tag, which is also the version label
        type: string
        required: true
      bundle-version:
        description: The CFBundleVersion the published build carries
        type: string
        required: true
      channel:
        description: Sparkle channel; empty for stable
        type: string
        required: true
      asset:
        description: File name of the published macOS archive
        type: string
        required: true
      length:
        description: Size of that archive in bytes
        type: string
        required: true
      signature:
        description: Its EdDSA signature
        type: string
        required: true
    secrets:
      cloudflare-api-token:
        description: Token with Workers Scripts edit rights on the account
        required: true

# The feed is served from https://niumaterm-updates.f32.io/appcast.xml by the
# niumaterm-updates Worker. Sparkle needs one HTTPS address that never moves, because the address
# is stamped into every build that ships and an installation only ever asks the
# one it was built with. What makes the file trustworthy is the EdDSA signature
# over the archive it names, so a static asset behind that address is enough.
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FEED_URL: https://niumaterm-updates.f32.io/appcast.xml
      # A Workers assets deploy replaces the whole set, so the rendered feed has
      # to be placed in the asset directory rather than kept in source control.
      FEED_PATH: updates/public/appcast.xml
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the current feed
        run: |
          # 404 is the state before the first publish, and the generator starts
          # a new document from it. Any other status is a real failure: taking
          # one for "absent" would silently drop the published history and ship
          # a feed holding only the release this run adds.
          status=$(curl -sS -o "$FEED_PATH" -w '%{http_code}' "$FEED_URL")
          case "$status" in
            200) ;;
            404) rm -f "$FEED_PATH" ;;
            *)
              echo "unexpected status $status from $FEED_URL" >&2
              exit 1
              ;;
          esac

      - run: |
          python3 scripts/update-appcast.py \
            --appcast "$FEED_PATH" \
            --label "$LABEL" \
            --bundle-version "$BUNDLE_VERSION" \
            --channel "$CHANNEL" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$LABEL/$ASSET" \
            --page-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$LABEL" \
            --length "$LENGTH" \
            --signature "$SIGNATURE"
        env:
          LABEL: ${{ inputs.label }}
          BUNDLE_VERSION: ${{ inputs.bundle-version }}
          CHANNEL: ${{ inputs.channel }}
          ASSET: ${{ inputs.asset }}
          LENGTH: ${{ inputs.length }}
          SIGNATURE: ${{ inputs.signature }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Publish the feed
        run: |
          npm ci
          npx wrangler deploy -c updates/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare-api-token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
