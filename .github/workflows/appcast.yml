name: Appcast

on:
  workflow_call:
    inputs:
      label:
        description: Release tag, which is also the version label
        type: string
        required: true
      bundle-version:
        description: The CFBundleVersion the published build carries
        type: string
        required: true
      channel:
        description: Sparkle channel; empty for stable
        type: string
        required: true
      asset:
        description: File name of the published macOS archive
        type: string
        required: true
      length:
        description: Size of that archive in bytes
        type: string
        required: true
      signature:
        description: Its EdDSA signature
        type: string
        required: true

# The feed lives as the single asset of a release under a fixed tag. Sparkle
# needs one HTTPS address that never moves, because the address is stamped into
# every build that ships and an installation only ever asks the one it was built
# with. What makes the file trustworthy is the signature over the archive it
# names, not where it was served from, so a plain static asset is enough.
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      FEED_TAG: appcast
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the current feed
        run: |
          # Absent until the first publish, and the generator starts a new
          # document in that case. Asking whether the release exists first keeps
          # that apart from a download that actually failed.
          if gh release view "$FEED_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$FEED_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern appcast.xml --dir .
          fi

      - run: |
          python3 scripts/update-appcast.py \
            --appcast appcast.xml \
            --label "$LABEL" \
            --bundle-version "$BUNDLE_VERSION" \
            --channel "$CHANNEL" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$LABEL/$ASSET" \
            --page-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$LABEL" \
            --length "$LENGTH" \
            --signature "$SIGNATURE"
        env:
          LABEL: ${{ inputs.label }}
          BUNDLE_VERSION: ${{ inputs.bundle-version }}
          CHANNEL: ${{ inputs.channel }}
          ASSET: ${{ inputs.asset }}
          LENGTH: ${{ inputs.length }}
          SIGNATURE: ${{ inputs.signature }}

      - name: Publish the feed
        run: |
          # Marked a prerelease so it never becomes the repository's "Latest
          # release": it holds a document, not a build anyone downloads.
          gh release view "$FEED_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$FEED_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Update feed" \
              --prerelease \
              --notes "The Sparkle appcast for macOS builds. Replaced by CI on every release; not a build."

          gh release upload "$FEED_TAG" appcast.xml \
            --repo "$GITHUB_REPOSITORY" --clobber
