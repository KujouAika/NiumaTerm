name: Nightly build

on:
  workflow_dispatch:

jobs:
  name:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.name.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      # The date comes from the commit rather than the run, so rebuilding a
      # revision reproduces the name it was published under, and so a locally
      # built binary of the same revision carries the same version string.
      - id: name
        run: |
          date=$(git show -s --format=%cd --date=format:%Y%m%d "$GITHUB_SHA")
          commit=$(git rev-parse --short=7 "$GITHUB_SHA")
          echo "tag=nightly-$date-$commit" >> "$GITHUB_OUTPUT"

  package:
    needs: name
    uses: ./.github/workflows/windows-package.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.name.outputs.tag }}

  package-macos:
    needs: name
    uses: ./.github/workflows/macos-package.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.name.outputs.tag }}
    # Signing and notarization need the certificate and App Store Connect
    # secrets, which a called workflow does not inherit on its own.
    secrets: inherit

  # Tagging runs after the build so a nightly tag only ever marks a revision
  # that actually produced a package.
  tag:
    needs: [name, package, package-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # The tag names the revision, so it collides only when the same revision
      # is built twice; forcing keeps that run from failing and leaves the tag
      # on the revision it already marked.
      - run: |
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
        env:
          TAG: ${{ needs.name.outputs.tag }}

  release:
    needs: [name, tag, package-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NiumaTerm-windows-x86_64-${{ needs.name.outputs.tag }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package-macos.outputs.artifact }}
          path: dist
      # A second run on the same revision reuses the tag, and gh refuses to
      # create a release for a tag that already has one; dropping the old
      # release republishes the newer package against that tag.
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.name.outputs.tag }}
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --prerelease \
            --notes "Automated nightly build of $GITHUB_SHA."

  # After the release, because the feed entry points at an asset that has to be
  # downloadable by the time an updater reads it.
  appcast:
    needs: [name, package-macos, release]
    uses: ./.github/workflows/appcast.yml
    # A called workflow may not request more than the calling job was
    # granted, and a job that names no permissions gets the repository
    # default, which is read-only. `publish` replaces the feed asset, so the
    # grant has to be made here rather than left to the default.
    permissions:
      contents: write
    with:
      label: ${{ needs.name.outputs.tag }}
      bundle-version: ${{ needs.package-macos.outputs.bundle-version }}
      channel: nightly
      asset: ${{ needs.package-macos.outputs.asset }}
      length: ${{ needs.package-macos.outputs.length }}
      signature: ${{ needs.package-macos.outputs.ed-signature }}
