[package]
name = "nmt-readability"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
quote = "=1.0.47"
syn = { version = "=2.0.119", features = ["full", "visit"] }
tempfile = "=3.27.0"
tree-sitter = "=0.26.13"
tree-sitter-swift = "=0.7.3"

# The tool keeps the compiler's default lint levels rather than the
# workspace's, so the workspace clippy denials do not apply to it.
[lints.cargo]
missing_lints_inheritance = "allow"
